name: Update subscriber count

# The badge number comes from Kit's API, which needs a secret key. That key
# can't be exposed in the page, so the count is baked into index.html here
# and committed — the site stays fully static.

on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC daily
  workflow_dispatch: # run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: subscriber-count
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch count and update index.html
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: python3 scripts/update_subscriber_count.py

      - name: Commit if the number changed
        run: |
          if [[ -z "$(git status --porcelain index.html)" ]]; then
            echo "No change — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: update newsletter subscriber count [skip ci]"
          git push
